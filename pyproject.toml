[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "Portfolio-level backtesting, factor research and statistical arbitrage toolkit"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.24",
    "yfinance>=0.2.40",
    "statsmodels>=0.14",
    "pyarrow>=15",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=42",  # MySQL 8 caching_sha2_password auth
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
ml = ["scikit-learn>=1.4"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "tabulate>=0.9", "bandit>=1.7", "mypy>=1.10", "pandas-stubs", "types-requests"]

[tool.setuptools.packages.find]
include = ["quantlab*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
exclude = ['^\.venv/', '^web/', '^\.cache/', '^build/']
ignore_missing_imports = true
warn_unused_ignores = true
