name: Paper bot (daily)

# Steps the paper-trading bot once per US trading day, after the close.
# Cron runs in UTC and has no DST: 21:30 UTC is 17:30 New York in summer
# (EDT) and 16:30 in winter (EST), so it is always after the 16:00 close.
# Holidays are harmless: no new bar -> "nothing to do".
#
# Needs a database the runner can reach (the bot's state lives there):
#   Settings -> Secrets and variables -> Actions -> BOT_DATABASE_URL
#   e.g. mysql+pymysql://user:password@host:3306/quantlab?charset=utf8mb4
# Without the secret the job skips itself (your laptop's MySQL is not
# reachable from GitHub; use deploy/windows or deploy/systemd for that).

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      bot:
        description: Bot name
        default: sp500-pairs

concurrency:
  group: paper-bot # never two runs on the same state
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.BOT_DATABASE_URL }}
      BOT_NAME: ${{ inputs.bot || 'sp500-pairs' }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::BOT_DATABASE_URL is not set - skipping the paper bot run."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.cfg.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: steps.cfg.outputs.enabled == 'true'
        run: pip install -e .
      - if: steps.cfg.outputs.enabled == 'true'
        name: Run bot
        run: python -m quantlab.bot run --name "$BOT_NAME"
      - if: steps.cfg.outputs.enabled == 'true'
        name: Status
        run: |
          {
            echo '```json'
            python -m quantlab.bot status --name "$BOT_NAME"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
