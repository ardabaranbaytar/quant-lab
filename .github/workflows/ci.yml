name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Python (ruff, bandit, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[api,ml,dev]"
      - name: Lint (ruff)
        run: ruff check --output-format=github .
      - name: Security (bandit)
        run: bandit -r . -ll -q   # picks up the project .bandit file
      - name: Types (mypy)
        run: mypy .
      - name: Tests (pytest)
        # Synthetic data only: no network, SQLite instead of MySQL.
        run: pytest -q

  frontend:
    name: Web (oxlint, tsc, vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
